name: apt-exp
on:
  pull_request:
    branches: [main]
jobs:
  exp:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          for p in libglib2.0-dev pkg-config dbus python3-gi gir1.2-glib-2.0 ffmpeg xdotool; do printf '%s: ' $p; dpkg -s $p 2>/dev/null | grep -E '^Status' || echo missing; done
          apt-cache policy ffmpeg | head -3
          sudo apt-get install -s --no-install-recommends libglib2.0-dev pkg-config dbus python3-gi gir1.2-glib-2.0 | tail -5
          which -a python3; /usr/bin/python3 -c "import gi" && echo system-gi-ok
          python3 --version
