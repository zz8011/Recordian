name: apt-exp
on:
  pull_request:
    branches: [main]
jobs:
  exp:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
        mode: [bg, fg]
        rep: [1, 2, 3, 4]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: apt ${{ matrix.mode }}
        run: |
          start=$(date +%s)
          if [ "${{ matrix.mode }}" = bg ]; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq libglib2.0-dev pkg-config dbus python3-gi gir1.2-glib-2.0 ffmpeg) > "$RUNNER_TEMP/apt.log" 2>&1 &
            apt_pid=$!
            python -m pip install -q pytest numpy flask requests mypy ruff
            wait "$apt_pid" || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq libglib2.0-dev pkg-config dbus python3-gi gir1.2-glib-2.0 ffmpeg
            python -m pip install -q pytest numpy flask requests mypy ruff
          fi
          echo "ELAPSED $(( $(date +%s) - start ))s"
