name: apt-exp
on:
  pull_request:
    branches: [main]
jobs:
  exp:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: apt verbose
        run: |
          date -u +%T
          cat /etc/apt/apt-mirrors.txt 2>/dev/null | head -3
          timeout 100 sudo apt-get -o Acquire::Retries=0 update || echo "UPDATE rc=$?"
          date -u +%T
          timeout 150 sudo apt-get -y -o Debug::pkgAcquire::Worker=0 install libglib2.0-dev pkg-config dbus python3-gi gir1.2-glib-2.0 ffmpeg > /tmp/inst.log 2>&1 || echo "INSTALL rc=$?"
          date -u +%T
          tail -15 /tmp/inst.log
          ps aux | grep -E "apt|dpkg|needrestart|unattended" | grep -v grep | head
