name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

# PR 新推送取消旧运行；push（含 main）按 sha 独占分组，永不被取消或被后一次 push 顶掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    # apt（音频解码测试依赖 ffmpeg）与 pip 并行安装
    - name: Install dependencies
      run: |
        APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
        (sudo apt-get "${APT_OPTS[@]}" update -qq && sudo apt-get "${APT_OPTS[@]}" install -y -qq --no-install-recommends ffmpeg) > "$RUNNER_TEMP/apt.log" 2>&1 &
        apt_pid=$!
        python -m pip install -e ".[dev]"
        wait "$apt_pid" || { cat "$RUNNER_TEMP/apt.log"; exit 1; }

    - name: Run tests with pytest
      run: |
        echo "cores: $(nproc)"
        pytest -n auto --cov=src/recordian --cov-report=xml --cov-report=term

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.python-version }}
        path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev]"

    - name: Check code style with ruff
      run: |
        ruff check src/ tests/

    - name: Type check with mypy
      run: |
        mypy src/recordian --ignore-missing-imports --no-strict-optional
